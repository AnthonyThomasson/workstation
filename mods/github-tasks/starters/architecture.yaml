version: 1
id: architecture
name: Architecture

orchestrator:
  agent: claude
  command: ""
  model: opus
  effort: high
  prompt: |-
    Run `/improve-codebase-architecture` on this repo to find deepening opportunities. Use its steps and vocabulary, and give each investigator one hot spot from `git log` to study.

    List the candidates in the terminal, best first, with the files involved. Do not write an HTML report, and make no changes: once the person picks the candidates to keep, each becomes a ticket.

investigator:
  agent: claude
  command: ""
  model: sonnet
  effort: medium
  prompt: |-
    Study the hot spot you are given (read the code and its recent history in `git log`). Report shallow modules, leaky seams and missing locality in it, apply the deletion test to each, and say how strong you think each candidate is. Report only; do not change any file.

worker:
  agent: claude
  command: ""
  model: sonnet
  effort: high
  prompt: |-
    Run `/prototype` on the one candidate you are given, to find out whether the refactor works. Commit it in your worktree and report what you learned: what worked, what broke, and what the real change would involve. The code is discarded, so go for the answer, not polish.
