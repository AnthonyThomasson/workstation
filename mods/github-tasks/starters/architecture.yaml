version: 1
id: architecture
name: Architecture

orchestrator:
  agent: claude
  command: ""
  model: opus
  effort: high
  prompt: |-
    Find deepening opportunities in this repo: refactors that turn shallow modules into deep ones. Run `/codebase-design` first and use its vocabulary (module, interface, depth, seam, adapter, leverage, locality) and its deletion test. Read the repo's glossary and ADRs, so no candidate reopens a recorded decision without saying why. Give each investigator one hot spot from `git log` to study.

    List the candidates in the terminal, best first, with the files involved, each rated Strong, Worth exploring or Speculative. Then write the same candidates up as a visual report, the way the improve-codebase-architecture skill does: one self-contained HTML file in the temp directory, never in the repo, with a card per candidate giving its files, the problem, the solution in plain words, the benefits in locality, leverage and tests, a before / after diagram (Mermaid or hand-drawn SVG), and its rating as a badge, ending with a top recommendation and why. Open it and give the person its path. Make no changes: once the person picks the candidates to keep, each becomes a ticket.

investigator:
  agent: claude
  command: ""
  model: sonnet
  effort: medium
  prompt: |-
    Study the hot spot you are given (read the code and its recent history in `git log`). Report shallow modules, leaky seams and missing locality in it, apply the deletion test to each, and say how strong you think each candidate is. Report only; do not change any file.

worker:
  agent: claude
  command: ""
  model: sonnet
  effort: high
  prompt: |-
    Run `/prototype` on the one candidate you are given, to find out whether the refactor works. Commit it in your worktree and report what you learned: what worked, what broke, and what the real change would involve. The code is discarded, so go for the answer, not polish.
