version: 1
id: bug
name: Bug

trigger:
  labels:
    - bug
  match: any

orchestrator:
  agent: claude
  command: ""
  model: opus
  effort: high
  prompt: ""
  planning: "Have a worker reproduce the bug with a failing test, agree the fix with the user, then have the same worker fix it test-first."
  retro: "Look back on what slowed the run and what to write down for next time."

worker:
  agent: claude
  command: ""
  model: sonnet
  effort: medium
  prompt: "Work test-first, and when reproducing the bug paste the failing run's exact command and output in your report, because the read-only reviewer can't see the old code fail."

reviewer:
  agent: claude
  command: ""
  model: haiku
  effort: low
  prompt: "Confirm from the reproduction commit and the worker's pasted red run that the test reproduces the bug, then run the tests to check the fix is the smallest right one and breaks nothing else."
