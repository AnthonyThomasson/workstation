version: 1
id: story
name: Story

trigger:
  labels: []
  match: any

orchestrator:
  agent: claude
  command: ""
  model: opus
  effort: high
  prompt: ""
  planning: "Explore the code the ticket touches and the repo's AGENTS.md / CLAUDE.md, question the user until nothing material is open (showing a mock-up for any visual part), then present the plan for acceptance."
  retro: "Look back on what slowed the run and what to write down for next time."

worker:
  agent: claude
  command: ""
  model: sonnet
  effort: high
  prompt: "Build the ticket test-first following the repo's AGENTS.md / CLAUDE.md, review your own diff, and commit referencing the ticket as `#<n>`."

reviewer:
  agent: claude
  command: ""
  model: sonnet
  effort: high
  prompt: "Review the changes since `origin/main` against the ticket, reporting only."
