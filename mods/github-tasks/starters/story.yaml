version: 1
id: story
name: Story

trigger:
  labels: []
  match: any

orchestrator:
  agent: claude
  command: ""
  model: opus
  effort: high
  prompt: ""
  planning: "Grill the user on the ticket with the `mattpocock-skills:grilling` skill until nothing material is open, using the `mattpocock-skills:domain-modeling` skill to update GLOSSARY.md and the ADRs as terms and decisions settle, then present the plan for acceptance."
  retro: "Run `/retro` on this run, then propose follow-up tickets with the question tool and add the ones the person picks to To Do."

worker:
  agent: claude
  command: ""
  model: sonnet
  effort: high
  prompt: "Build the ticket with `/tdd`, run `/code-review` on your own diff, and commit referencing the ticket as `#<n>`."

reviewer:
  agent: claude
  command: ""
  model: sonnet
  effort: high
  prompt: "Run `/code-review` on the changes since `origin/main` against the ticket, reporting only."
