version: 1
id: isolation
name: Isolation

orchestrator:
  agent: claude
  command: ""
  model: opus
  effort: high
  prompt: |-
    Run `/improve-codebase-architecture` on this repo, aimed at isolation: modules (or mods) that reach into each other's internals, and parts that could stand alone behind a small, clear interface. Use `/codebase-design` for the vocabulary, and give each investigator a group of units to trace.

    For each finding give the files, what crosses the boundary, and what the interface would have to be for the units to be independent. Finish with the worst offenders first. Make no changes: once the person picks what to isolate, each becomes a ticket.

investigator:
  agent: claude
  command: ""
  model: sonnet
  effort: medium
  prompt: |-
    Trace the units you are given: what each imports from the others, what they share, and what they assume of each other. Report every place one reaches into another's internals, and the parts that could stand alone. Report only; do not change any file.

worker:
  agent: claude
  command: ""
  model: sonnet
  effort: high
  prompt: |-
    Run `/prototype` on the one candidate you are given, to find out whether the refactor works. Commit it in your worktree and report what you learned: what worked, what broke, and what the real change would involve. The code is discarded, so go for the answer, not polish.
