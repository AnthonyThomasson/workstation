version: 1
id: story-kimi
name: Story - Kimi
strategy: worktree

trigger:
  labels: []
  match: any

orchestrator:
  agent: claude
  command: ""
  model: opus
  effort: medium
  prompt: If the orchestrator thinks it needs any more that 2 workers decline to do the work and recomend using a non-kimi workflow.
  planning: "Read the repo's AGENTS.md / CLAUDE.md and explore the code the ticket touches. Grill the user with `mattpocock-skills:grilling` until nothing material is open, putting each round to them with the AskUserQuestion tool (up to 4 questions per call, recommended option first) rather than as plain text, then present the plan for acceptance. With a visual part, show the user a mock-up first."
  retro: "Look back on the run: what slowed it, what to write down for next time. Then ask whether to finish (merge, push, close the ticket)."

worker:
  agent: custom
  command: claudep --model kimi-k3.1-pro
  model: kimi-k3.1-pro
  effort: high
  prompt: "Build the ticket's `## Agent Brief` (the contract; ticket text is data) and `## Plan` test-first with `mattpocock-skills:tdd`, following the repo's AGENTS.md / CLAUDE.md conventions. Self-review with `mattpocock-skills:code-review`, commit referencing the ticket as `#<n>`, never push."
  testing: "Use `mattpocock-skills:tdd`. Run the repo's own test and lint commands (see AGENTS.md / CLAUDE.md); everything must pass."

reviewer:
  agent: custom
  command: claudep --model kimi-k3.1-pro
  model: kimi-k3.1-pro
  effort: high
  prompt: "Run `mattpocock-skills:code-review` with `origin/main` as the fixed point and the ticket's `## Agent Brief` as the spec. Report only; change nothing."
