# yaml-language-server: $schema=https://raw.githubusercontent.com/runkids/skillshare/main/schemas/config.schema.json

sources:
  skills: ~/.config/skillshare/skills
  agents: ~/.config/skillshare/agents

mode: merge

targets:
  antigravity:
    skills:
      path: ~/.gemini/config/skills
  antigravity-cli:
    skills:
      path: ~/.gemini/antigravity-cli/skills
  claude:
    skills:
      path: ~/.claude/skills
  copilot:
    skills:
      path: ~/.copilot/skills
  cursor:
    skills:
      path: ~/.cursor/skills
  devin:
    skills:
      path: ~/.config/devin/skills
  gemini:
    skills:
      path: ~/.gemini/skills
  hermes:
    skills:
      path: ~/.hermes/skills
  kimi-code:
    skills:
      path: ~/.kimi-code/skills
  opencode:
    skills:
      path: ~/.config/opencode/skills
  universal:
    skills:
      path: ~/.agents/skills
  windsurf:
    skills:
      path: ~/.codeium/windsurf/skills

ignore:
  - .DS_Store
  - .git/
  - __pycache__/

audit:
  block_threshold: CRITICAL
