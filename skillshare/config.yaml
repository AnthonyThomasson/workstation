# yaml-language-server: $schema=https://raw.githubusercontent.com/runkids/skillshare/main/schemas/config.schema.json

sources:
  skills: ~/.config/skillshare/skills
  agents: ~/.config/skillshare/agents

mode: merge

targets:
  antigravity:
    skills:
      path: ~/.gemini/config/skills
  antigravity-cli:
    skills:
      path: ~/.gemini/antigravity-cli/skills
  claude:
    skills:
      path: ~/.claude/skills
  devin:
    skills:
      path: ~/.config/devin/skills
  hermes:
    skills:
      path: ~/.hermes/skills
  universal:
    skills:
      path: ~/.agents/skills
  windsurf:
    skills:
      path: ~/.codeium/windsurf/skills

ignore:
  - .DS_Store
  - .git/
  - __pycache__/

audit:
  block_threshold: CRITICAL

mcp:
  servers:
    godot:
      command: npx
      args:
        - -y
        - '@coding-solo/godot-mcp@0.1.1'
      env:
        GODOT_PATH: /Applications/Godot_mono.app/Contents/MacOS/Godot
      targets:
        - claude

plugins:
  version: 2
  packages:
    mattpocock-skills:
      bindings:
        claude:
          imported: true
    voicemode:
      bindings:
        claude:
          imported: true

preserve_tilde_on_save: true
